apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: zammad
  title: Zammad Helpdesk
  description: >-
    AGM's helpdesk/customer support ticketing system (helpdesk.agmegypt.com).
    Fork of the upstream zammad/zammad open-source project WITH AGM changes:
    production runs a hand-built image (zammad-agm) from the AGM branch
    feature/editor-highlight-textalign, which adds Highlight, TextAlign and
    colour actions to the ticket editors, a Docker build fix and a report
    download URL fix on top of an upstream develop snapshot of 2026-04-29.
    The default branch (develop) is not deployed and is not kept in sync
    with upstream. Handles email, phone (CTI) and web ticketing; the phone
    channel is fed by the 3cx-zammad-bridge daemon. See docs/reference.md
    "AGM changes".
  tags:
    - ruby
    - rails
    - helpdesk
    - ticketing
    - customer-support
  links:
    - url: https://helpdesk.agmegypt.com
      title: Zammad (live instance)
      icon: dashboard
    - url: https://docs.zammad.org
      title: Upstream Zammad documentation
      icon: docs
    - url: https://github.com/AGM-One-Vision/zammad
      title: Source (AGM fork)
      icon: github
    - url: https://github.com/zammad/zammad
      title: Upstream repository
      icon: github
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: AGM-One-Vision/zammad
    devhub.agm/origin: forked-oss
    devhub.agm/upstream-repo: https://github.com/zammad/zammad
    devhub.agm/visibility: internal
spec:
  type: service
  lifecycle: production
  owner: group:default/dto
  system: system:default/zammad
  providesApis:
    - zammad-api
